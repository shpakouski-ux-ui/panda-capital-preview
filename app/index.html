<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panda">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Panda</title>
<style>
:root{--bg:#000;--panel:#0d0f12;--line:#1d2127;--text:#e8ecef;--muted:#8a929a;--lime:#c8ff00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;flex:none}
.scr{position:absolute;inset:0;background:#000;will-change:transform}
.scr .mid{position:absolute;left:0;right:0;background-size:100% 100%;background-repeat:no-repeat}
.scr .top{position:absolute;left:0;right:0;top:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scr .top::-webkit-scrollbar{display:none}
.scr .img{position:relative;background-repeat:no-repeat}
.scr .bot{position:absolute;left:0;right:0;bottom:0;background-repeat:no-repeat}
.hs{position:absolute;border-radius:12px;cursor:pointer;transition:background .15s}
.hs:active,.hs.down{background:rgba(0,0,0,.28)}
.show .hs{box-shadow:0 0 0 1.5px var(--lime) inset;background:rgba(200,255,0,.12)}
#sbar{position:absolute;left:0;right:0;top:0;z-index:5;display:none}
#press{position:absolute;left:0;right:0;top:0;height:44px;z-index:6}
/* desktop */
#side{display:none}
body.desk #app{gap:48px;padding:24px}
body.desk #stage{border-radius:54px;box-shadow:0 0 0 10px #16191d,0 0 0 11px #2a2f36,0 40px 120px rgba(0,0,0,.6)}
body.desk #side{display:flex;flex-direction:column;width:300px;max-height:calc(100vh - 48px);background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.side-h{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.side-h h1{margin:0 0 4px;font-size:17px}
.side-h p{margin:0;color:var(--muted);font-size:12px}
.tog{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--lime)}
.sizes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sizes button{background:#15181c;border:1px solid var(--line);color:var(--muted);border-radius:8px;font:500 11px system-ui;padding:4px 8px;cursor:pointer}
.sizes button.on{color:var(--lime);border-color:#3a4a10}
.list{overflow:auto;padding:8px 0 16px}
.list h2{margin:14px 20px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.list a{display:block;padding:6px 20px;color:var(--text);text-decoration:none;font-size:13px;border-left:2px solid transparent}
.list a:hover{background:#13161a}
.list a.on{border-left-color:var(--lime);color:var(--lime);background:#12160a}
#map{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 0 env(safe-area-inset-bottom)}
#map.open{display:flex}
#map .top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px}
#map .top b{font-size:17px}
#map button{background:#1a1d22;color:#fff;border:0;border-radius:16px;height:32px;padding:0 14px;font:600 13px -apple-system,system-ui,sans-serif}
#map .list{flex:1}
#map .list a{padding:10px 16px;font-size:15px}
#hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:9;background:#15181c;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;display:none;gap:10px;align-items:center}
#hint b{color:var(--lime)}
#hint button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="sbar"></div><div id="press"></div></div>
  <aside id="side">
    <div class="side-h">
      <h1>Panda MVP · v2</h1>
      <p>Coins: deposit, withdraw, transfer. Account: log in, settings, withdrawal whitelist. On iPhone: long-press the status bar for the screen list, swipe from the left edge to go back.</p>
      <label class="tog"><input type="checkbox" id="showhs"> Show clickable areas</label>
      <div class="sizes" id="sizes"></div>
    </div>
    <nav class="list" id="list1"></nav>
  </aside>
</div>
<div id="map"><div class="top"><b>All screens</b><button id="mapclose">Close</button></div><nav class="list" id="list2"></nav></div>
<div id="hint"><span>For full screen: <b>Share → Add to Home Screen</b></span><button id="hintx" aria-label="Close">×</button></div>
