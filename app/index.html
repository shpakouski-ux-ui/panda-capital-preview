<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panda">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Panda MVP prototype</title>
<style>
:root{--bg:#000;--panel:#0d0f12;--line:#1d2127;--text:#e8ecef;--muted:#8a929a;--lime:#c8ff00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;flex:none}
#layer{position:absolute;left:0;top:0;width:100%;aspect-ratio:393/852}
#layer img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
#layer img.next{opacity:0}
.hs{position:absolute;border-radius:10px;cursor:pointer}
.flash .hs,.show .hs{background:rgba(200,255,0,.18);box-shadow:0 0 0 1.5px var(--lime) inset}
.flash .hs{animation:fl .7s ease-out forwards}
@keyframes fl{to{background:rgba(200,255,0,0);box-shadow:0 0 0 1.5px rgba(200,255,0,0) inset}}
#sbar{position:absolute;left:0;right:0;top:0;background:#000;display:none;z-index:3}
/* map button over the status bar centre (phone) */
#mapbtn{position:absolute;z-index:4;top:6px;left:50%;transform:translateX(-50%);height:26px;padding:0 12px;border-radius:13px;border:0;background:rgba(255,255,255,.12);color:#fff;font:600 12px -apple-system,system-ui,sans-serif;display:none;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* desktop chrome */
#side{display:none}
body.desk #app{justify-content:center;gap:48px;padding:24px}
body.desk #stage{border-radius:54px;box-shadow:0 0 0 10px #16191d,0 0 0 11px #2a2f36,0 40px 120px rgba(0,0,0,.6)}
body.desk #side{display:flex;flex-direction:column;width:300px;max-height:calc(100vh - 48px);background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.side-h{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.side-h h1{margin:0 0 4px;font-size:17px}
.side-h p{margin:0;color:var(--muted);font-size:12px}
.tog{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.tog input{accent-color:var(--lime)}
.list{overflow:auto;padding:8px 0 16px}
.list h2{margin:14px 20px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.list a{display:block;padding:6px 20px;color:var(--text);text-decoration:none;font-size:13px;border-left:2px solid transparent}
.list a:hover{background:#13161a}
.list a.on{border-left-color:var(--lime);color:var(--lime);background:#12160a}
/* phone map overlay */
#map{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 0 env(safe-area-inset-bottom)}
#map.open{display:flex}
#map .top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px}
#map .top b{font-size:17px}
#map button{background:#1a1d22;color:#fff;border:0;border-radius:16px;height:32px;padding:0 14px;font:600 13px -apple-system,system-ui,sans-serif}
#map .list{flex:1}
#map .list a{padding:10px 16px;font-size:15px}
#map .list h2{margin:18px 16px 6px}
#hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:9;background:#15181c;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;display:none;gap:10px;align-items:center}
#hint b{color:var(--lime)}
#hint button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="layer"><img id="a" alt=""><div id="hsl"></div></div>
    <div id="sbar"></div>
    <button id="mapbtn" aria-label="All screens">Screens</button>
  </div>
  <aside id="side">
    <div class="side-h">
      <h1>Panda MVP · v2</h1>
      <p>Coins: deposit, withdraw, transfer. Account: log in, settings, withdrawal whitelist. Tap anywhere to see what's clickable.</p>
      <label class="tog"><input type="checkbox" id="showhs"> Show clickable areas</label>
    </div>
    <nav class="list" id="list1"></nav>
  </aside>
</div>
<div id="map"><div class="top"><b>All screens</b><button id="mapclose">Close</button></div><nav class="list" id="list2"></nav></div>
<div id="hint"><span>For full screen: <b>Share → Add to Home Screen</b></span><button id="hintx" aria-label="Close">×</button></div>

function layout(){
  const vw=innerWidth, vh=innerHeight;
  let w,h;
  if(isDesk){ h=Math.min(H, vh-48); w=h*W/H; stage.style.width=w+'px'; stage.style.height=h+'px'; layer.style.top='0'; return; }

    return;

  // mobile browser: fit whole screen into the viewport
  const s=Math.min(vw/W, vh/H); w=W*s; h=H*s;

}

(()=>{ const p=document.createElement('div'); p.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden'; document.body.appendChild(p); document.documentElement.style.setProperty('--sat',p.offsetHeight+''); p.remove(); })();
let cur=null; const img=$('a');
function render(id){
  const s=BY[id]||BY[START]; cur=s.id;
  img.src=src(s.id);
  hsl.innerHTML='';
  for(const h of s.hs){
    const d=document.createElement('div'); d.className='hs';
    const [x,y,w,hh]=h.b; d.style.cssText=`left:${x/W*100}%;top:${y/H*100}%;width:${w/W*100}%;height:${hh/H*100}%`;
    d.onclick=e=>{ e.stopPropagation(); go(h.to); }; hsl.appendChild(d);
    if(h.to!=='back') pre(h.to);
  }
  document.querySelectorAll('.list a').forEach(a=>a.classList.toggle('on',a.dataset.id===s.id));
  const on=document.querySelector('#list1 a.on'); if(on) on.scrollIntoView({block:'nearest'});
  document.title=s.name+' · Panda prototype';
}
function go(to){
  if(to==='back'){ if(history.length>1&&history.state&&history.state.n>0) history.back(); return; }
  const n=(history.state&&history.state.n||0)+1;
  history.pushState({id:to,n},'', '#'+to); render(to);
}
addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(id!==cur&&BY[id]) render(id); });
addEventListener('popstate',e=>render((e.state&&e.state.id)||location.hash.slice(1)||START));
layer.addEventListener('click',()=>{ layer.classList.remove('flash'); void layer.offsetWidth; layer.classList.add('flash'); });
$('showhs').onchange=e=>layer.classList.toggle('show',e.target.checked);
function buildList(el){
  let sec=null;
  for(const s of S){ if(s.sec!==sec){ sec=s.sec; const h=document.createElement('h2'); h.textContent=sec; el.appendChild(h); }
    const a=document.createElement('a'); a.href='#'+s.id; a.dataset.id=s.id; a.textContent=s.name;
    a.onclick=e=>{ e.preventDefault(); $('map').classList.remove('open'); go(s.id); }; el.appendChild(a); }
}
buildList($('list1')); buildList($('list2'));
if(!isDesk){ $('mapbtn').style.display='block'; }
$('mapbtn').onclick=e=>{ e.stopPropagation(); $('map').classList.add('open'); };
$('mapclose').onclick=()=>$('map').classList.remove('open');
// add-to-home-screen hint for iPhone Safari
try{ if(!isDesk&&!isStandalone&&/iPhone|iPad/.test(navigator.userAgent)&&!localStorage.getItem('pandaHint')){ $('hint').style.display='flex'; } }catch(e){}
$('hintx').onclick=()=>{ $('hint').style.display='none'; try{localStorage.setItem('pandaHint','1')}catch(e){} };
addEventListener('resize',layout); layout();
const first=location.hash.slice(1); const id=BY[first]?first:START;
history.replaceState({id,n:0},'','#'+id); render(id);
</script>
</body>
